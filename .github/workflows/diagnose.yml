name: Diagnose Docker Hub credentials
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PAT via Docker Hub API
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set +e
          echo "token_len=${#DH_TOKEN}"
          echo "=== /v2/user/ ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $DH_TOKEN" https://hub.docker.com/v2/user/ | head -c 400
          echo ""
          echo "=== docker login ==="
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin 2>&1 | head -10
