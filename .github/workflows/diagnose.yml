name: Diagnose Docker Hub credentials
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PAT via Docker Hub API
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set +e
          echo "username=[$DH_USER] token_len=${#DH_TOKEN}"
          echo "=== GET /v2/user/ with Bearer token ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $DH_TOKEN" https://hub.docker.com/v2/user/ | head -c 800
          echo ""
          echo "=== repo check ==="
          curl -s -o /dev/null -w "HTTP:%{http_code}\n" -H "Authorization: Bearer $DH_TOKEN" \
            "https://hub.docker.com/v2/repositories/${DH_USER}/zerotier/"
          echo "=== docker login ==="
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin 2>&1 | head -20
          echo "=== docker login with lowercase username ==="
          echo "$DH_TOKEN" | docker login -u "$(echo $DH_USER | tr 'A-Z' 'a-z')" --password-stdin 2>&1 | head -20
